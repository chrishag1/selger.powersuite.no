<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">

        <!-- http://getbootstrap.com/docs/5.3/ -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- Select2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

    <!-- jQuery (nødvendig for Select2) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Select2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>



    <link href="/static/style.css" rel="stylesheet">
    <script src="/static/script.js"></script>

    <link rel="apple-touch-icon" sizes="180x180" href="/static/bilder/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/bilder/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/bilder/favicon/favicon-16x16.png">
    <link rel="manifest" href="/static/bilder/favicon/site.webmanifest">


    <title>Power Suite {% block title %}{% endblock %}</title>
    <!-- By Chris -->

</head>
<body class="bg-light">
    <div class="bg-dark py-4">
        <div class="container d-flex flex-wrap justify-content-center gap-3">
            <a href="/?butikk={{ valgt_butikk }}">
                <div class="orange-bakgrunn rounded text-center px-5 py-2 me-lg-3">
                    <h5 class="fw-bold mb-0">Hjem</h5>
                </div>
            </a>
            <select id="butikk-velger" class="form-select">
                {% for butikk in alle_butikker %}
                    <option value="{{ butikk }}">{{ butikk }}</option>
                {% endfor %}
            </select>

            <form id="produkt-sok-skjema" class="d-flex ms-lg-3 mt-2 mt-lg-0">
                <input type="text" id="produkt-sok" class="form-control" placeholder="Søk etter produkt..." name="produkt_sok">
            </form>
            {% block filtre %}
            {% endblock %}

        </div>
    </div>

    {% block main %}
    {% endblock %}
</body>
</html>
